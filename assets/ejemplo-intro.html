<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Intro B-roll · Horizontes IA</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Anton"; src: url("assets/fonts/anton-400.woff2") format("woff2"); font-weight: 400; }
      @font-face { font-family: "Caveat"; src: url("assets/fonts/caveat-700.woff2") format("woff2"); font-weight: 700; }
      @font-face { font-family: "DM Sans"; src: url("assets/fonts/dm-sans-latin-wght-normal.woff2") format("woff2"); font-weight: 100 1000; }

      :root {
        --ink: #141414;
        --yellow: #ffc21a;
        --orange: #f2701c;
        --cream: #f6f0e4;
        --paper: #efe6d2;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "DM Sans", sans-serif; }

      .fill { position: absolute; inset: 0; width: 100%; height: 100%; }
      video.fill { object-fit: cover; }
      .paper {
        background-color: var(--paper);
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='360' height='360'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' seed='7' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.36  0 0 0 0 0.28  0 0 0 0 0.16  0 0 0 0.13 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
      }

      /* cámara: footage + sandwich + recorte se mueven juntos */
      #cam { position: absolute; inset: 0; transform-origin: 50% 40%; }
      .layer { position: absolute; inset: 0; }
      .scene { position: absolute; inset: 0; opacity: 0; overflow: hidden; }

      /* sticker blanco para personajes al frente */
      .sticker { filter: drop-shadow(5px 0 0 #fff) drop-shadow(-5px 0 0 #fff) drop-shadow(0 5px 0 #fff) drop-shadow(0 -5px 0 #fff) drop-shadow(0 10px 14px rgba(0, 0, 0, 0.35)); }

      .kin {
        position: absolute; font-family: "Anton", sans-serif; line-height: 1; color: var(--yellow);
        -webkit-text-stroke: 14px var(--ink); paint-order: stroke fill; text-shadow: 0 16px 0 var(--ink);
        opacity: 0; white-space: nowrap; letter-spacing: 0.01em;
      }

      .tag {
        position: absolute; font: 700 78px "Caveat", cursive; color: var(--ink); background: var(--yellow);
        border: 6px solid var(--ink); border-radius: 18px; box-shadow: 0 9px 0 var(--ink);
        padding: 0 30px 8px; line-height: 1.1; white-space: nowrap; opacity: 0;
      }
      .tag.white { background: #fff; }
      .arrow { position: absolute; opacity: 0; overflow: visible; }
      .arrow path { fill: none; stroke: var(--ink); stroke-width: 9; stroke-linecap: round; stroke-linejoin: round; }

      /* estilos */
      #est-back { position: absolute; inset: 0; background: var(--ink); }
      .card {
        position: absolute; top: 78px; width: 520px; height: 924px; border: 8px solid #fff; border-radius: 26px;
        overflow: hidden; box-shadow: 0 22px 0 rgba(255, 255, 255, 0.18); background: #fff;
      }

      /* capas 3D */
      #capas-persp { position: absolute; inset: 0; perspective: 2600px; perspective-origin: 50% 35%; }
      #capas-stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-style: preserve-3d; }
      .plane { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; }
      #planeA { background: #000; outline: 0 solid #fff; }
      #planeB { border: 0 dashed var(--ink); }

      /* panel de roles */
      #roles-panel { position: absolute; left: 960px; top: 0; width: 960px; height: 1080px; overflow: hidden; border-left: 8px solid var(--ink); }
      #roles-title { position: absolute; left: 0; right: 0; top: 34px; text-align: center; font: 700 82px "Caveat", cursive; color: var(--ink); }
      #roles-x { position: absolute; left: 0; top: 0; width: 960px; height: 1080px; overflow: visible; }
      #roles-x path { fill: none; stroke: var(--orange); stroke-width: 22; stroke-linecap: round; }

      #flash { position: absolute; inset: 0; background: #fff; opacity: 0; }
      #fadeout { position: absolute; inset: 0; background: #000; opacity: 0; }

      /* subtítulos */
      #caps { position: absolute; left: 0; right: 0; bottom: 64px; height: 110px; }
      .cap { position: absolute; left: 0; right: 0; bottom: 0; text-align: center; opacity: 0; }
      .cap span {
        display: inline-block; margin: 0 15px; font: 800 64px "DM Sans", sans-serif; color: #fff; letter-spacing: -0.01em;
        -webkit-text-stroke: 13px var(--ink); paint-order: stroke fill; text-shadow: 0 7px 0 rgba(0, 0, 0, 0.45);
      }
    </style>
  </head>
  <body>

    <script>
      const CAPS = __CAPTIONS__;
      const tl = gsap.timeline({ paused: true });

      const scene = (sel, a, b) => { tl.set(sel, { opacity: 1 }, a); tl.set(sel, { opacity: 0 }, b); };

      // --- cámara: punches y split ---
      tl.set("#cam", { scale: 1, x: 0 }, 0);
      tl.set("#cam", { scale: 1.1 }, 8.6);
      tl.to("#cam", { scale: 1.04, duration: 2.3, ease: "power1.out" }, 8.6);
      tl.set("#cam", { scale: 1 }, 12.35);
      tl.to("#cam", { scale: 1.12, duration: 0.18, ease: "power3.out" }, 14.15);
      tl.to("#cam", { scale: 1.16, duration: 2.6, ease: "none" }, 14.4);
      tl.set("#cam", { scale: 1 }, 20.6);
      tl.to("#cam", { x: -480, duration: 0.45, ease: "power3.inOut" }, 32.4);
      tl.to("#cam", { x: 0, duration: 0.4, ease: "power3.inOut" }, 36.3);
      tl.to("#cam", { scale: 1.07, duration: 0.15, ease: "power3.out" }, 41.85);

      // --- recorte de Santi solo en las ventanas sandwich ---
      [[0, 2.9], [12.35, 14.15], [16.95, 17.8], [36.3, 41.7], [41.82, 43.3]].forEach(([a, b]) => scene("#mattewrap", a, b));

      // S1 · tijeras detrás de Santi
      tl.fromTo("#s1wrap", { opacity: 0, scale: 0.92 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)" }, 0);
      tl.to("#s1wrap", { opacity: 0, duration: 0.18 }, 2.7);

      // S2 · espectador confundido al frente
      tl.fromTo("#s2wrap", { opacity: 0, scale: 0.5, rotation: -8 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.32, ease: "back.out(2.2)" }, 2.9);
      tl.to("#s2wrap", { opacity: 0, scale: 0.85, duration: 0.15 }, 4.78);

      // S3 · buzón (iris)
      scene("#sc-buzon", 4.85, 8.6);
      tl.fromTo("#sc-buzon", { clipPath: "circle(0% at 50% 45%)" }, { clipPath: "circle(80% at 50% 45%)", duration: 0.42, ease: "power2.out" }, 4.85);

      // S4 · tres estilos
      scene("#sc-estilos", 10.95, 12.35);
      tl.fromTo("#est-back", { yPercent: 100 }, { yPercent: 0, duration: 0.22, ease: "power3.out" }, 10.95);
      [["#card1", -6], ["#card2", 2], ["#card3", 7]].forEach(([c, r], i) => {
        tl.fromTo(c, { y: -1150, rotation: r * 3 }, { y: 0, rotation: r, duration: 0.38, ease: "back.out(1.5)" }, 11.0 + i * 0.12);
      });

      // S5 · aplausos detrás de Santi
      tl.fromTo("#s5wrap", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(2)" }, 12.35);

      // S6 · "B ROLL" detrás de la cabeza
      tl.fromTo("#kin-b", { opacity: 0, scale: 0.3, y: 90 }, { opacity: 1, scale: 1, y: 0, duration: 0.24, ease: "back.out(2.4)" }, 17.06);
      tl.fromTo("#kin-roll", { opacity: 0, scale: 0.3, y: 90 }, { opacity: 1, scale: 1, y: 0, duration: 0.24, ease: "back.out(2.4)" }, 17.26);
      tl.set(["#kin-b", "#kin-roll"], { opacity: 0 }, 17.8);

      // S7 · pizza: tu video = la masa, B-roll = los ingredientes
      scene("#sc-pizza", 17.8, 20.9);
      tl.fromTo("#sc-pizza", { scale: 1.08 }, { scale: 1, duration: 0.3, ease: "power3.out" }, 17.8);
      tl.fromTo("#tag-video", { opacity: 0, scale: 0.4, rotation: -10 }, { opacity: 1, scale: 1, rotation: -4, duration: 0.3, ease: "back.out(2)" }, 18.0);
      tl.to("#arr-video", { opacity: 1, duration: 0.15 }, 18.1);
      tl.to(["#tag-video", "#arr-video"], { opacity: 0, duration: 0.15 }, 19.0);
      tl.fromTo("#tag-broll", { opacity: 0, scale: 0.4, rotation: 10 }, { opacity: 1, scale: 1, rotation: 4, duration: 0.3, ease: "back.out(2)" }, 19.05);
      tl.to("#arr-broll", { opacity: 1, duration: 0.15 }, 19.15);
      tl.to("#sc-pizza", { x: -1920, duration: 0.35, ease: "power3.in" }, 20.55);

      // S8 · capas 3D: el B-roll vive encima del video
      scene("#sc-capas", 20.55, 25.3);
      tl.fromTo("#sc-capas", { x: 1920 }, { x: 0, duration: 0.35, ease: "power3.out" }, 20.55);
      tl.set("#capas-stage", { scale: 1, rotationX: 0, rotationZ: 0, y: 0 }, 20.55);
      tl.set("#planeB", { z: 0 }, 20.55);
      tl.to("#capas-stage", { scale: 0.56, rotationX: 50, rotationZ: -26, y: 70, duration: 0.8, ease: "power3.inOut" }, 20.95);
      tl.to("#planeB", { z: 360, borderWidth: 6, duration: 0.8, ease: "power3.inOut" }, 20.95);
      tl.to("#planeA", { outlineWidth: 10, borderRadius: 18, duration: 0.5 }, 21.1);
      tl.fromTo("#tag-capaA", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, rotation: -4, duration: 0.28, ease: "back.out(2)" }, 21.7);
      tl.fromTo("#tag-capaB", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, rotation: 4, duration: 0.28, ease: "back.out(2)" }, 21.85);
      tl.to("#planeB", { z: 430, duration: 0.55, ease: "sine.inOut", yoyo: true, repeat: 1 }, 22.3);
      tl.to(["#tag-capaA", "#tag-capaB"], { opacity: 0, duration: 0.15 }, 23.45);
      tl.to("#capas-stage", { scale: 1, rotationX: 0, rotationZ: 0, y: 0, duration: 0.6, ease: "power3.inOut" }, 23.5);
      tl.to("#planeB", { z: 0, borderWidth: 0, duration: 0.6, ease: "power3.inOut" }, 23.5);
      tl.to("#planeA", { outlineWidth: 0, borderRadius: 0, duration: 0.4 }, 23.6);
      tl.fromTo("#kin-alta", { opacity: 0, scale: 2.2, rotation: -12 }, { opacity: 1, scale: 1, rotation: -4, duration: 0.25, ease: "power4.out" }, 23.62);

      // S9 · avión de papel → tele y celular (whip)
      scene("#sc-avion", 25.0, 28.55);
      tl.fromTo("#sc-avion", { x: 1920, skewX: -10 }, { x: 0, skewX: 0, duration: 0.3, ease: "power4.out" }, 25.0);

      // S10 · espectacular (wipe desde arriba)
      scene("#sc-espect", 28.2, 32.85);
      tl.fromTo("#sc-espect", { clipPath: "inset(0% 0% 100% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.35, ease: "power3.out" }, 28.2);
      tl.to("#sc-espect", { x: -1920, duration: 0.42, ease: "power3.inOut" }, 32.43);

      // S11 · split: no ocupas ser programador / editor / diseñador
      tl.set("#roles-panel", { opacity: 1 }, 32.43);
      tl.fromTo("#roles-panel", { x: 960 }, { x: 0, duration: 0.45, ease: "power3.out" }, 32.43);
      ["#x1a", "#x1b", "#x2a", "#x2b", "#x3a", "#x3b"].forEach((id) => tl.set(id, { strokeDasharray: 300, strokeDashoffset: 300 }, 0));
      [[33.74, "#x1a", "#x1b"], [34.7, "#x2a", "#x2b"], [35.54, "#x3a", "#x3b"]].forEach(([t, a, b]) => {
        tl.to(a, { strokeDashoffset: 0, duration: 0.13, ease: "power2.out" }, t);
        tl.to(b, { strokeDashoffset: 0, duration: 0.13, ease: "power2.out" }, t + 0.11);
      });
      tl.to("#roles-panel", { x: 960, duration: 0.4, ease: "power3.inOut" }, 36.3);
      tl.set("#roles-panel", { opacity: 0 }, 36.72);
      tl.to("#caps", { x: -480, duration: 0.45, ease: "power3.inOut" }, 32.4);
      tl.to("#caps", { x: 0, duration: 0.4, ease: "power3.inOut" }, 36.3);

      // S12 · foco detrás de Santi
      tl.fromTo("#s12wrap", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.32, ease: "back.out(2)" }, 36.42);
      tl.to("#s12wrap", { opacity: 0, duration: 0.2 }, 41.48);

      // S13 · "SÚPER SENCILLO" detrás de la cabeza
      tl.fromTo("#kin-super", { opacity: 0, scale: 0.3, y: 80 }, { opacity: 1, scale: 1, y: 0, duration: 0.24, ease: "back.out(2.4)" }, 41.88);
      tl.fromTo("#kin-sencillo", { opacity: 0, scale: 0.3, y: 80 }, { opacity: 1, scale: 1, y: 0, duration: 0.24, ease: "back.out(2.4)" }, 42.7);

      // S14 · claqueta "empecemos"
      scene("#sc-claqueta", 43.3, 45.21);
      tl.set("#flash", { opacity: 0.9 }, 43.3);
      tl.to("#flash", { opacity: 0, duration: 0.22, ease: "power2.out" }, 43.3);
      tl.fromTo("#sc-claqueta", { scale: 1.1 }, { scale: 1, duration: 0.3, ease: "power3.out" }, 43.3);
      tl.to("#fadeout", { opacity: 1, duration: 0.28, ease: "power1.in" }, 44.9);

      // --- subtítulos palabra por palabra ---
      const capsEl = document.getElementById("caps");
      CAPS.forEach((g, i) => {
        const d = document.createElement("div");
        d.className = "cap";
        d.id = "cap" + i;
        g.w.forEach((w, j) => {
          const s = document.createElement("span");
          s.id = `cap${i}w${j}`;
          s.textContent = w[0];
          d.appendChild(s);
        });
        capsEl.appendChild(d);
        tl.set(d, { opacity: 1 }, g.s);
        tl.fromTo(d, { y: 16 }, { y: 0, duration: 0.12, ease: "power2.out" }, g.s);
        tl.set(d, { opacity: 0 }, g.e);
        g.w.forEach((w, j) => {
          tl.set(`#cap${i}w${j}`, { color: "#ffc21a", scale: 1.08 }, w[1]);
          if (j > 0) tl.set(`#cap${i}w${j - 1}`, { color: "#ffffff", scale: 1 }, w[1]);
        });
      });

      window.__timelines["main"] = tl;
    </script>
